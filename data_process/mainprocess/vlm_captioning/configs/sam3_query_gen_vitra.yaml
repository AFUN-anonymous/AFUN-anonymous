# VLM config for SAM3 query generation, VITRA egocentric video with a contact
# frame (vitra_epic, vitra_ego4d). Uses the prompt in tasks/sam3_query_gen_vitra.py.
#
# Usage:
#   python mainprocess.py stage=query_gen_vllm dataset_name=vitra_epic \
#       vlm.config_path=mainprocess/vlm_captioning/configs/sam3_query_gen_vitra.yaml

# ---- Model ----
model:
  model_name_or_path: "Qwen/Qwen3.5-35B-A3B-FP8"
  dtype: "auto"
  quantization: null
  trust_remote_code: true

# ---- vLLM Engine ----
engine:
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  gpu_memory_utilization: 0.85
  # Raw Ego4D frames (~1408x1408) can exceed 8192 tokens per prompt.
  max_model_len: 16384
  max_num_seqs: 128
  enforce_eager: true
  allowed_local_media_path: "/"
  seed: 42
  limit_mm_per_prompt:
    image: 4
  extra_kwargs: {}

# ---- Generation / Sampling ----
generation:
  max_new_tokens: 512
  temperature: 0.2
  top_p: 0.95
  top_k: -1
  repetition_penalty: 1.0
  stop: null
  enable_thinking: false

# ---- Pipeline ----
prompt_template: "sam3_query_gen_vitra"
