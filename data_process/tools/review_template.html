<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AFUN review: __TITLE__</title>
<link rel="icon" href="data:,">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f5f5f5; }
header { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
         padding: 10px 20px; background: white; border-bottom: 1px solid #ddd; font-size: 14px; }
header button { padding: 5px 11px; border: 1px solid #ccc; border-radius: 4px; background: white; cursor: pointer; }
header button.active { background: #3b82f6; border-color: #3b82f6; color: white; }
#progress { width: 180px; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
#progress div { height: 100%; width: 0; background: #22c55e; }
#help { margin-left: auto; color: #666; font-size: 12px; }
.card { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 12px 16px; padding: 14px; background: white;
        border: 3px solid transparent; border-radius: 8px; box-shadow: 0 2px 4px rgba(0, 0, 0, .08); }
.card.kept { border-color: #22c55e; background: #f0fdf4; }
.card.discarded { border-color: #ef4444; background: #fef2f2; opacity: .65; }
.card.current { box-shadow: 0 0 0 3px #3b82f6; }
.info, .actions { grid-column: 1 / -1; }
.id { color: #555; font: 12px monospace; word-break: break-all; }
.task { margin: 8px 0; color: #1f2937; font-size: 18px; font-weight: 600; }
.badge { display: inline-block; margin-right: 6px; padding: 2px 7px; border-radius: 3px; background: #e5e7eb; font-size: 11px; }
.excellent { background: #22c55e; color: white; } .good { background: #38bdf8; color: white; }
.fair { background: #facc15; } .poor { background: #ef4444; color: white; }
.card img { display: block; width: 100%; border: 1px solid #ddd; border-radius: 4px; }
.plot { width: 100%; height: 500px; }
.actions { display: flex; align-items: center; gap: 12px; padding-top: 8px; border-top: 1px solid #eee; }
.actions button { padding: 10px 28px; border: 0; border-radius: 6px; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
.keep { background: #22c55e; } .discard { background: #ef4444; }
.status { margin-left: auto; color: #888; font-size: 13px; }
.hidden { display: none; }
</style>
</head>
<body>
<header>
  <b>__TITLE__</b>
  <span>Kept <b id="kept">0</b></span>
  <span>Discarded <b id="discarded">0</b></span>
  <span>Left <b id="left">0</b></span>
  <div id="progress"><div></div></div>
  <span id="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="todo">Todo</button>
    <button data-filter="kept">Kept</button>
    <button data-filter="discarded">Discarded</button>
  </span>
  <button id="export">Export</button>
  <button id="import">Import</button>
  <button id="keep-list">Keep list</button>
  <input id="import-file" class="hidden" type="file" accept=".json">
  <span id="help">space/y keep &middot; n discard &middot; j/&darr; next &middot; k/&uarr; previous &middot; s next todo</span>
</header>
<main id="cards"></main>

<template id="card">
  <section class="card">
    <div class="info">
      <div class="id"></div>
      <div class="task"></div>
      <span class="badge quality"></span><span class="badge dataset"></span><span class="badge error"></span>
    </div>
    <img alt="Observation with mask and motion">
    <div class="plot"></div>
    <div class="actions">
      <button class="keep">Keep</button>
      <button class="discard">Discard</button>
      <span class="status"></span>
    </div>
  </section>
</template>

<script>
const SAMPLES = __SAMPLES__;
const STORAGE_KEY = "afun_review";
const decisions = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");  // id -> "kept" | "discarded"
const cards = [];
let filter = "all";

const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const floats = (b64) => new Float32Array(bytes(b64).buffer);

function refresh(card) {
  const status = decisions[card.dataset.id];
  card.classList.toggle("kept", status === "kept");
  card.classList.toggle("discarded", status === "discarded");
  card.querySelector(".status").textContent = (status || "").toUpperCase();
  const shown = filter === "all" || (filter === "todo" ? !status : status === filter);
  card.classList.toggle("hidden", !shown);
}

function refreshAll() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(decisions));
  const count = (status) => SAMPLES.filter((s) => decisions[s.id] === status).length;
  const kept = count("kept"), discarded = count("discarded");
  document.getElementById("kept").textContent = kept;
  document.getElementById("discarded").textContent = discarded;
  document.getElementById("left").textContent = SAMPLES.length - kept - discarded;
  document.querySelector("#progress div").style.width = `${100 * (kept + discarded) / SAMPLES.length}%`;
  cards.forEach(refresh);
}

const visibleCards = () => cards.filter((card) => !card.classList.contains("hidden"));

function currentIndex(visible) {
  const middle = window.innerHeight / 2;
  const distance = (card) => {
    const box = card.getBoundingClientRect();
    return Math.abs((box.top + box.bottom) / 2 - middle);
  };
  return visible.reduce((best, card, i) => (distance(card) < distance(visible[best]) ? i : best), 0);
}

function goTo(visible, index) {
  const card = visible[Math.max(0, Math.min(index, visible.length - 1))];
  if (!card) return;
  cards.forEach((c) => c.classList.remove("current"));
  card.classList.add("current");
  card.scrollIntoView({ behavior: "instant", block: "center" });
}

// Pressing the same decision again undoes it; a new decision moves on to the next sample.
function decide(card, status) {
  const visible = visibleCards();
  const index = visible.indexOf(card);
  if (decisions[card.dataset.id] === status) delete decisions[card.dataset.id];
  else decisions[card.dataset.id] = status;
  refreshAll();
  if (decisions[card.dataset.id]) goTo(visible, index + 1);
}

function drawPlot(card, sample) {
  const axes = (values) => {
    const xyz = [[], [], []];
    values.forEach((value, i) => xyz[i % 3].push(value));
    return { x: xyz[0], y: xyz[1], z: xyz[2] };
  };
  const rgb = bytes(sample.rgb), inMask = bytes(sample.in_mask);
  const colors = Array.from(inMask, (masked, i) =>
    masked ? "rgb(255,80,80)" : `rgb(${rgb[3 * i]},${rgb[3 * i + 1]},${rgb[3 * i + 2]})`);
  Plotly.newPlot(card.querySelector(".plot"), [
    { type: "scatter3d", mode: "markers", name: "Scene", hoverinfo: "skip", ...axes(floats(sample.xyz)),
      marker: { size: 2.5, color: colors } },
    { type: "scatter3d", mode: "markers+lines", name: "Raw trajectory", ...axes(floats(sample.raw)),
      marker: { size: 3, color: "orange" }, line: { color: "orange", width: 3 } },
    { type: "scatter3d", mode: "lines", name: "Bezier curve", ...axes(floats(sample.curve)),
      line: { color: "lime", width: 5 } },
  ], {
    // Camera frame (x right, y down, z forward), seen from the camera.
    scene: { aspectmode: "data", dragmode: "orbit", xaxis: { title: "X(m)" }, yaxis: { title: "Y(m)" },
             zaxis: { title: "Z(m)" },
             camera: { eye: { x: 0, y: 0, z: -1 }, center: { x: 0, y: 0, z: 0.85 }, up: { x: 0, y: -1, z: 0 } } },
    margin: { l: 0, r: 0, t: 0, b: 0 }, legend: { x: 0, y: 1 },
  }, { displayModeBar: false, responsive: true });
}

const plotObserver = new IntersectionObserver((entries) => {
  entries.filter((entry) => entry.isIntersecting).forEach((entry) => {
    plotObserver.unobserve(entry.target);
    drawPlot(entry.target, SAMPLES[cards.indexOf(entry.target)]);
  });
}, { rootMargin: "400px" });

SAMPLES.forEach((sample, i) => {
  const card = document.getElementById("card").content.firstElementChild.cloneNode(true);
  card.dataset.id = sample.id;
  card.querySelector(".id").textContent = `#${i + 1} ${sample.id}`;
  card.querySelector(".task").textContent = `"${sample.language}"`;
  card.querySelector(".quality").textContent = sample.quality;
  card.querySelector(".quality").classList.add(sample.quality);
  card.querySelector(".dataset").textContent = sample.dataset;
  card.querySelector(".error").textContent = `rel_err: ${sample.rel_err.toFixed(4)}`;
  card.querySelector("img").src = `data:image/jpeg;base64,${sample.image}`;
  card.querySelector(".keep").addEventListener("click", () => decide(card, "kept"));
  card.querySelector(".discard").addEventListener("click", () => decide(card, "discarded"));
  cards.push(card);
  document.getElementById("cards").appendChild(card);
  plotObserver.observe(card);
});

document.addEventListener("keydown", (event) => {
  const visible = visibleCards();
  const index = currentIndex(visible);
  const card = visible[index];
  if (!card) return;
  if (event.key === "j" || event.key === "ArrowDown") goTo(visible, index + 1);
  else if (event.key === "k" || event.key === "ArrowUp") goTo(visible, index - 1);
  else if (event.key === " " || event.key === "y") decide(card, "kept");
  else if (event.key === "n") decide(card, "discarded");
  else if (event.key === "s") {
    const next = visible.findIndex((c, i) => i > index && !decisions[c.dataset.id]);
    if (next >= 0) goTo(visible, next);
  } else return;
  event.preventDefault();
});

document.querySelectorAll("#filters button").forEach((button) => button.addEventListener("click", () => {
  filter = button.dataset.filter;
  document.querySelectorAll("#filters button").forEach((b) => b.classList.toggle("active", b === button));
  cards.forEach(refresh);
}));

function download(name, text) {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([text]));
  link.download = name;
  link.click();
}

document.getElementById("export").addEventListener("click", () =>
  download("afun_review.json", JSON.stringify(decisions, null, 1)));
document.getElementById("keep-list").addEventListener("click", () => {
  const kept = Object.keys(decisions).filter((id) => decisions[id] === "kept").sort();
  download("keep_list.txt", kept.join("\n") + "\n");
});
document.getElementById("import").addEventListener("click", () => document.getElementById("import-file").click());
document.getElementById("import-file").addEventListener("change", async (event) => {
  const imported = JSON.parse(await event.target.files[0].text());
  for (const [id, status] of Object.entries(imported)) {
    if (status === "kept" || status === "discarded") decisions[id] = status;
  }
  event.target.value = "";
  refreshAll();
});

refreshAll();
</script>
</body>
</html>
