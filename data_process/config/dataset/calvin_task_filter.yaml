  - turn_on_lightbulb
  - turn_off_lightbulb
  - turn_on_led
  - turn_off_led
  # place_object
  - place_in_drawer
  - place_in_slider
  # push_object
  - push_red_block_right
  - push_red_block_left
  - push_blue_block_right
  - push_blue_block_left
  - push_pink_block_right
  - push_pink_block_left
  # push_object_into
  - push_into_drawer
