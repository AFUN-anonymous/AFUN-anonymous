# CALVIN task filter: only annotations of these tasks are kept (read by
# CalvinPreprocess and tools/calvin_rerender_640.py via `keep_tasks`).
#
# Kept task types:
#   move_door_rel     open/close drawer, move slider left/right  (4 tasks)
#   toggle_light      turn on/off lightbulb, turn on/off LED     (4 tasks)
