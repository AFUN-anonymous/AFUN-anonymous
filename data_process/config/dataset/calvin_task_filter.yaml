#   push_object       push {red,blue,pink} block {left,right}    (6 tasks)
#   push_object_into  push into drawer                           (1 task)
# Excluded:
#   lift_object (9 tasks)     simple pick-up, no interesting contact trajectory
#   rotate_object (6 tasks)   in-hand rotation
#   stack_objects (1 task)    stacking
#   unstack_objects (1 task)  unstacking

